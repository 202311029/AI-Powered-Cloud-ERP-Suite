apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amdox-erp.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: amdox-config
            - secretRef:
                name: amdox-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
